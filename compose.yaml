
name: resona

x-resona-env: &resona-env
  # Application security
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}

  # Database and storage
  DATABASE_PATH: ${DATABASE_PATH:-/app/instance/resona.sqlite3}
  RESONA_STORAGE_ROOT: ${RESONA_STORAGE_ROOT:-/app/instance/storage}
  RESONA_USER_QUOTA_BYTES: ${RESONA_USER_QUOTA_BYTES:-1073741824}

  # Administrator
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}

  # AI provider
  CLOSEAI_BASE_URL: ${CLOSEAI_BASE_URL:-https://api.openai-proxy.org}
  CLOSEAI_API_KEY: ${CLOSEAI_API_KEY:-}
  CLOSEAI_MODEL: ${CLOSEAI_MODEL:-gpt-5.6-sol}
  CLOSEAI_PREFER_ENV: ${CLOSEAI_PREFER_ENV:-1}
  CLOSEAI_READ_TIMEOUT_SECONDS: ${CLOSEAI_READ_TIMEOUT_SECONDS:-300}

  # Resend email service
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
  RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Resona}

  # CAPTCHA
  CAPTCHA_CHALLENGE_COUNT: ${CAPTCHA_CHALLENGE_COUNT:-50}
  CAPTCHA_CHALLENGE_DIFFICULTY: ${CAPTCHA_CHALLENGE_DIFFICULTY:-4}

  # Production URLs
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://resona.neuorise.com}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}

  # Exabyte OIDC
  EXABYTE_OIDC_ISSUER: ${EXABYTE_OIDC_ISSUER:-https://accounts.exabyte.org.cn}
  EXABYTE_OIDC_CALLBACK_URL: ${EXABYTE_OIDC_CALLBACK_URL:-https://resona.neuorise.com/auth/exabyte/callback}
  EXABYTE_OIDC_SCOPES: "${EXABYTE_OIDC_SCOPES:-openid profile email}"

  # Redis
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}

  # AI agent
  AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-80}

services:
  web:
    build:
      context: .
    image: resona:local
    restart: unless-stopped

    environment: *resona-env

    ports:
      - "8001:8001"

    volumes:
      - resona-instance:/app/instance

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  maintenance:
    image: resona:local
    restart: unless-stopped

    environment: *resona-env

    command:
      - sh
      - -c
      - "while true; do flask --app run:app exabyte-maintenance; sleep 60; done"

    volumes:
      - resona-instance:/app/instance

    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - resona-redis:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  resona-instance:
  resona-redis:
